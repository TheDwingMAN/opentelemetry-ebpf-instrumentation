name: kprobe benchmark (scratch)

on:
  push:
    branches: [kprobe-bench]

permissions:
  contents: read

jobs:
  bench:
    name: "kprobe benchmark (${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Generate BPF
        run: make prereqs docker-generate

      - name: Build
        run: |
          CGO_ENABLED=0 go build -o /tmp/obi ./cmd/obi
          (cd .kprobe-bench/kprobecost && CGO_ENABLED=0 go build -o /tmp/kprobecost .)
          (cd .kprobe-bench/bpfstats && CGO_ENABLED=0 go build -o /tmp/bpfstats .)

      - name: Benchmark
        run: |
          sudo OUT=/tmp/kprobe-bench .kprobe-bench/bench.sh /tmp/obi /tmp/kprobecost /tmp/bpfstats
          cat /tmp/kprobe-bench/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: OBI log
        if: always()
        run: sudo tail -50 /tmp/kprobe-bench/obi.log || true
