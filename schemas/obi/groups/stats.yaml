groups:
  # `obi.ip` / `src.*` / `dst.*` are reused from `registry.obi.network` so we
  # don't duplicate the declarations here. Only the stats-specific `reason`
  # is introduced.
  - id: registry.obi.stats
    type: attribute_group
    display_name: OBI Connection Stats
    brief: >
      Attributes carried on OBI's per-connection TCP statistics. Emitted
      when the `stats_tcp_rtt` or `stats_tcp_failed_connections` features
      are enabled (both rolled into the umbrella `stats` feature). Like
      network-flow metrics, the per-data-point attribute set is configurable
      via `attributes.select`.
    attributes:
      - id: reason
        type:
          allow_custom_values: true
          members:
            - id: refused
              value: refused
              stability: development
            - id: reset
              value: reset
              stability: development
            - id: timed_out
              value: timed-out
              stability: development
            - id: host_unreachable
              value: host-unreachable
              stability: development
            - id: net_unreachable
              value: net-unreachable
              stability: development
            - id: other
              value: other
              stability: development
            - id: unknown
              value: unknown
              stability: development
        stability: development
        brief: Classification of why a TCP connection failed.
      # Mirrors `FsOpType` in `pkg/internal/statsolly/ebpf/stat.go`.
      # The filesystem type is identified by which implementation the probe
      # fired on, not by inspecting the event.
      - id: fs.operation
        type:
          allow_custom_values: false
          members:
            - id: read
              value: read
              stability: development
            - id: write
              value: write
              stability: development
            - id: fsync
              value: fsync
              stability: development
        stability: development
        brief: Filesystem operation performed.
      # Mirrors `NetworkTCPHandshakeRoleType` in
      # `pkg/internal/statsolly/ebpf/stat.go`. Identifies which side of the
      # TCP handshake OBI observed the failure on.
      - id: network.tcp.handshake.role
        type:
          allow_custom_values: true
          members:
            - id: client
              value: client
              stability: development
            - id: server
              value: server
              stability: development
            - id: unknown
              value: unknown
              stability: development
        stability: development
        brief: >
          Role of the local endpoint in the failed TCP three-way handshake
          (`client` initiated the SYN, `server` was awaiting it).

  - id: metric.obi_stat_tcp_rtt
    type: metric
    metric_name: obi.stat.tcp.rtt
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Smoothed round-trip time observed per TCP connection.
    attributes:
      - ref: obi.ip
      - ref: src.address
      - ref: dst.address
      - ref: src.port
      - ref: dst.port
      - ref: src.name
      - ref: dst.name
      - ref: src.zone
      - ref: dst.zone

  - id: metric.obi_stat_tcp_retransmits
    type: metric
    metric_name: obi.stat.tcp.retransmits
    instrument: counter
    unit: ""
    stability: development
    brief: >
      Count of TCP retransmissions observed per connection.
    attributes:
      - ref: obi.ip
      - ref: src.address
      - ref: dst.address
      - ref: src.port
      - ref: dst.port
      - ref: src.name
      - ref: dst.name
      - ref: src.zone
      - ref: dst.zone

  - id: metric.obi_stat_tcp_io
    type: metric
    metric_name: obi.stat.tcp.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes transferred at the socket layer per TCP connection,
      broken down by direction.
    attributes:
      - ref: obi.ip
      - ref: src.address
      - ref: dst.address
      - ref: src.port
      - ref: dst.port
      - ref: src.name
      - ref: dst.name
      - ref: src.zone
      - ref: dst.zone
      - ref: network.io.direction

  # Counter has no explicit OTLP unit set; mirror that here so live-check
  # doesn't complain "Unit should be '1', but found ''".
  - id: metric.obi_stat_tcp_failed_connections
    type: metric
    metric_name: obi.stat.tcp.failed.connections
    instrument: counter
    unit: ""
    stability: development
    brief: >
      Count of TCP connections that failed to establish, broken down by
      `reason`.
    attributes:
      - ref: obi.ip
      - ref: src.address
      - ref: dst.address
      - ref: src.port
      - ref: dst.port
      - ref: src.name
      - ref: dst.name
      - ref: src.zone
      - ref: dst.zone
      - ref: reason
      - ref: network.tcp.handshake.role

  # Disk / storage block-layer stats. Emitted when the `storage_block`
  # feature is enabled. Both attributes are reused from upstream semconv
  # (`system.device` + `disk.io.direction`), so no OBI-specific attribute is
  # introduced here. The metric name follows the OBI `obi.stat.*` convention
  # used by the TCP stats above, rather than the upstream `system.disk.*`
  # namespace.
  #
  # `operation.duration` rather than `io.latency`: semconv reserves `duration`
  # for a histogram of a discrete operation's elapsed time, and a name must not
  # be both a leaf and a namespace -- `obi.stat.disk.io` is a metric in its own
  # right below.
  - id: metric.obi_stat_disk_operation_duration
    type: metric
    metric_name: obi.stat.disk.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Block-layer service latency per disk I/O request, measured from
      `block_rq_issue` to `block_rq_complete`, broken down by device and
      direction.
    attributes:
      - ref: system.device
      - ref: disk.io.direction

  # Companion to the latency histogram above: the volume of data moved by the
  # same block requests. Shares the `storage_block` feature gate and attribute
  # set, so enabling the feature yields both metrics.
  #
  # This carries the same semantics as upstream semconv's `system.disk.io` but
  # is published under the OBI namespace on purpose: emitting `system.disk.io`
  # would collide with the OTel Collector's `hostmetrics` receiver, which
  # publishes that metric with these same attributes, so a host running both
  # agents would get two writers on one series.
  #
  # The unit is not repeated in the metric name: semconv states that metrics
  # carrying their unit in OTEL metadata SHOULD NOT include it in the name.
  - id: metric.obi_stat_disk_io
    type: metric
    metric_name: obi.stat.disk.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes transferred at the block layer, accumulated per completed
      disk I/O request and broken down by device and direction.
    attributes:
      - ref: system.device
      - ref: disk.io.direction

  # Companion to the service-time histogram above, but for the other half of a
  # request's lifetime: how long it waited before being dispatched. Requires
  # the `block_rq_insert` tracepoint in addition to `block_rq_issue` /
  # `block_rq_complete`, gated separately as `storage_block_queue` since it is
  # extra kernel-side overhead the base duration/io metrics don't pay.
  - id: metric.obi_stat_disk_queue_duration
    type: metric
    metric_name: obi.stat.disk.queue.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Time a disk I/O request spent queued before being dispatched to the
      device, measured from `block_rq_insert` to `block_rq_issue`, broken down
      by device and direction.
    attributes:
      - ref: system.device
      - ref: disk.io.direction

  # Queue depth, not queue latency: the count of requests still in flight on
  # the device immediately after this one completed. Observed once per
  # completion rather than time-averaged, so it approximates instantaneous
  # saturation rather than a true utilization integral. Shares the
  # `storage_block_queue` feature gate with the queue duration metric above.
  - id: metric.obi_stat_disk_queue_depth
    type: metric
    metric_name: obi.stat.disk.queue.depth
    instrument: histogram
    unit: "{operation}"
    stability: development
    brief: >
      Number of block I/O requests still in flight on the device immediately
      after this request completed, observed per completion and broken down
      by device.
    attributes:
      - ref: system.device

  # Failed completions, keyed by the upstream error.type attribute so the
  # failure mode (ENOSPC, EIO, ...) is queryable without an OBI-specific
  # attribute. Emitted when the `storage_block_errors` feature is enabled.
  - id: metric.obi_stat_disk_operation_errors
    type: metric
    metric_name: obi.stat.disk.operation.errors
    instrument: counter
    unit: "{error}"
    stability: development
    brief: >
      Count of block I/O requests that completed with a non-zero error,
      broken down by device, direction and errno.
    attributes:
      - ref: system.device
      - ref: disk.io.direction
      - ref: error.type

  # Network filesystem stats. Emitted when the `storage_fs` feature is enabled.
  # Probes attach to each filesystem's own file_operations read/write
  # implementations (nfs_file_read, ceph_read_iter, cifs_loose_read_iter,
  # fuse_file_read_iter and their write counterparts) rather than to generic
  # VFS, so a node not using a given filesystem pays nothing for it.
  #
  # Semantics note: buffered writes return once data is in the page cache, so
  # this is application-perceived latency, not server round-trip time -- the
  # RPC happens later on a writeback thread.
  - id: metric.obi_stat_fs_operation_duration
    type: metric
    metric_name: obi.stat.fs.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Latency of a single network filesystem read or write as the application
      experiences it, broken down by filesystem type and operation.
    attributes:
      - ref: system.filesystem.type
      - ref: fs.operation

  # Companion to the histogram above: volume of data moved by the same
  # operations. Published under obi.* rather than system.filesystem.* so it
  # cannot double-count against the Collector's hostmetrics receiver.
  - id: metric.obi_stat_fs_io
    type: metric
    metric_name: obi.stat.fs.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes transferred through network filesystem read and write
      operations, broken down by filesystem type and operation.
    attributes:
      - ref: system.filesystem.type
      - ref: fs.operation

  # Failed filesystem operations, keyed by the upstream error.type attribute so
  # the failure mode (ESTALE, EIO, ENOSPC, ETIMEDOUT, ...) is queryable without
  # an OBI-specific attribute. Emitted when the `storage_fs_errors` feature is
  # enabled. The async io_uring completion marker (-EIOCBQUEUED) is excluded at
  # the probe: it is not a failure, just a deferred completion OBI does not
  # observe.
  - id: metric.obi_stat_fs_operation_errors
    type: metric
    metric_name: obi.stat.fs.operation.errors
    instrument: counter
    unit: "{error}"
    stability: development
    brief: >
      Count of network filesystem read or write operations that failed,
      broken down by filesystem type, operation and errno.
    attributes:
      - ref: system.filesystem.type
      - ref: fs.operation
      - ref: error.type
