    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Duration of the cache flush requests of block devices, from their issue
      to the device until their completion, per block device and outcome. It
      is not reported on the paths of dm-multipath devices: the multipath
      device reports the same flushes.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the request failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level: opt_in
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.discard.duration
    type: metric
    metric_name: obi.stat.disk.discard.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Duration of the block discard (TRIM) and secure erase requests, from their
      issue to the device until their completion, per block device and outcome.
      It is not reported on the paths of dm-multipath devices, nor, when
      `stats_disk_bio_devices` measures the NVMe native multipath heads, on
      their paths: the multipath device reports the same I/O.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the request failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level: opt_in
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.discard.io
    type: metric
    metric_name: obi.stat.disk.discard.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Bytes discarded by the block discard (TRIM) and secure erase requests
      that completed successfully, per block device and workload the requests
      are charged to.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.operation.inflight
    type: metric
    metric_name: obi.stat.disk.operation.inflight
    instrument: updowncounter
    unit: "{operation}"
    stability: development
    brief: >
      Block reads and writes that each device is serving when sampled: issued
      to the device and not yet completed, as `/sys/block/<device>/inflight`
      counts them, per block device and direction. Requests waiting in the I/O
      scheduler are not counted.
    note: >
      Sampled every `ebpf.batch_timeout`. Discards count as writes. From Linux
      6.10, /proc/diskstats field 9 (node_exporter's node_disk_io_now, the
      hostmetrics receiver's system.disk.pending_operations) also counts the
      requests waiting in the I/O scheduler, so it can be higher. For a
      bio-based volume (LVM, md RAID), it counts the bios submitted to the
      volume and not yet completed.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended

  - id: metric.obi.obi.stat.nfs.client.procedure.duration
    type: metric
    metric_name: obi.stat.nfs.client.procedure.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Duration of the RPCs of the kernel NFS client, from their start to their
      completion, per server, procedure, outcome and workload that started them.
    note: >
      For NFSv4, `onc_rpc.procedure.name` is the name the kernel client gives
      to each kind of COMPOUND request, after its main operation, e.g. `READ`
      or `OPEN`.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level: recommended
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the RPC failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level: opt_in
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.nfs.client.procedure.count
    type: metric
    metric_name: obi.stat.nfs.client.procedure.count
    instrument: counter
    unit: "{procedure}"
    stability: development
    brief: >
      Completed RPCs of the kernel NFS client, per server, procedure, outcome
      and workload that started them.
    note: >
      Like the semantic conventions' `nfs.client.procedure.count`, with the
      server, the outcome and the workload. For NFSv4, `onc_rpc.procedure.name`
      is the name the kernel client gives to each kind of COMPOUND request.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level: recommended
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the RPC failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.nfs.client.procedure.time
    type: metric
    metric_name: obi.stat.nfs.client.procedure.time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Sum of the durations of the completed RPCs of the kernel NFS client, from
      their start to their completion, per server, procedure and workload that
      started them.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level: recommended
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.nfs.client.io
    type: metric
    metric_name: obi.stat.nfs.client.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Bytes that the kernel NFS client read from (`receive`) and wrote to
      (`transmit`) NFS servers, per server and workload that started the RPCs.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: network.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.volume.info
    type: metric
    metric_name: obi.stat.disk.volume.info
    instrument: updowncounter
    unit: ""
    stability: development
    brief: >
      Info metric that links each stacked volume of the node (device mapper,
      md RAID or loop device) to the disks it is on: one series per volume and
      disk, of value 1, reported once more with 0 when the volume is gone.
      Join it on `system.device` with the block I/O metrics.
    note: >
      A volume over several disks (md RAID1) has a series per disk, a volume
      over another stacked volume has the disks of the bottom one, and a loop
      device has the disks of the filesystem that holds its file.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: obi.disk.volume.device
        requirement_level: recommended
      - ref: obi.disk.volume.name
        requirement_level:
          conditionally_required: if the volume is a device mapper volume
      - ref: system.device
        requirement_level: recommended

  - id: metric.obi.obi.stat.k8s.pod.volume.info
    type: metric
    metric_name: obi.stat.k8s.pod.volume.info
    instrument: updowncounter
    unit: ""
    stability: development
    brief: >
      Info metric that links each volume that a pod of the node mounts from a
      PersistentVolumeClaim to the device it is mounted from
      (`obi.disk.volume.device`) and to the disks of that device
      (`system.device`): one series per pod, volume and disk, of value 1,
      reported once more with 0 when the pod no longer mounts it. Join it on
      `system.device` with the block I/O metrics.
    note: >
      A volume on a stacked device, such as an LVM volume over several disks,
      has one series per disk.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: k8s.volume.name
        requirement_level: recommended
      - ref: k8s.volume.type
        requirement_level: opt_in
      - ref: k8s.persistentvolumeclaim.name
        requirement_level: recommended
      - ref: k8s.persistentvolume.name
        requirement_level: recommended
      - ref: obi.disk.volume.device
        requirement_level: recommended
      - ref: system.device
        requirement_level: recommended
      - ref: k8s.cluster.name
        requirement_level: recommended
      - ref: k8s.namespace.name
        requirement_level: recommended
      - ref: k8s.pod.name
        requirement_level: recommended
      - ref: k8s.owner.name
        requirement_level: recommended
      - ref: k8s.kind
        requirement_level: opt_in
