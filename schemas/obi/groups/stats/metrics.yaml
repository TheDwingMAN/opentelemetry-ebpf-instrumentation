  - id: metric.obi.obi.stat.disk.service_time
    type: metric
    metric_name: obi.stat.disk.service_time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Sum of the device service times of the completed block reads and writes
      (the sum of `obi.stat.disk.operation.duration`), per block device,
      direction and workload the I/O is charged to. Unlike
      `system.disk.operation_time` (/proc/diskstats), it excludes the wait in
      the I/O scheduler.
    note: >
      Divided by `obi.stat.disk.operations`, it is the mean service time per
      workload. Its rate is the average number of requests that the device
      serves at once (above 1 on devices that serve requests in parallel). Plus
      `obi.stat.disk.queue_time`, it is the time that /proc/diskstats counts
      and iostat's await averages.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

