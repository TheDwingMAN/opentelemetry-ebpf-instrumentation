  - id: metric.obi.obi.stat.disk.operation.duration
    type: metric
    metric_name: obi.stat.disk.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Device service time of the block reads and writes: from the issue of each
      request to the device until its completion, per block device, direction
      and outcome. It excludes the wait in the I/O scheduler, which
      `obi.stat.disk.queue_time` adds up. Three cases are timed otherwise: the
      bios of bio-based devices (LVM, md RAID, NVMe native multipath heads)
      from their submission, a write with a cache flush (a journal commit)
      until the end of its flush sequence, and the empty flush write of a file
      sync, which is never issued, from its allocation. Cache flushes and
      discards have their own histograms. It is not reported on the paths of
      dm-multipath devices, nor, when `stats_disk_bio_devices` measures the
      NVMe native multipath heads, on their paths: the multipath device reports
      the same I/O. Its workload attributes are opt-in:
      `obi.stat.disk.service_time` and `obi.stat.disk.operations` give the mean
      per workload.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.volume.name
        requirement_level:
          conditionally_required: if the block device is a device mapper device
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the block I/O request failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

