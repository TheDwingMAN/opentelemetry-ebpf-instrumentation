    stability: development
    brief: >
      Completed block reads and writes, those of
      `obi.stat.disk.service.duration`, per block device, direction, outcome
      and workload the I/O is charged to. It is the count of the histogram, and is also reported on the
      paths of dm-multipath devices, where the failures of a path show.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.volume.name
        requirement_level:
          conditionally_required: if the block device is a device mapper device
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: >
            if the block I/O request failed: the errno name of its status, e.g.
            `EIO`, `ETIMEDOUT`, `ENOLINK` (transport), `EREMOTEIO` (target),
            `ENODATA` (medium), `EBADE` (reservation conflict) or `EILSEQ`
            (protection), or `_OTHER`
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.service_time
    type: metric
    metric_name: obi.stat.disk.service_time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Sum of the device service times of the completed block reads and writes,
      as `obi.stat.disk.service.duration` measures them, per block device,
      direction, outcome and workload the I/O is charged to. It is the sum of
      the histogram, and is also
      reported on the paths of dm-multipath devices. Unlike
      `system.disk.operation_time` (/proc/diskstats), it excludes the wait in
      the I/O scheduler. Divided by `obi.stat.disk.operations`, both summed by
      the same attributes, it is the mean service time. Its rate is the
      average number of requests that the device serves at once, above 1 on
      devices that serve requests in parallel.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.volume.name
        requirement_level:
          conditionally_required: if the block device is a device mapper device
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: >
            if the block I/O request failed: the errno name of its status, e.g.
            `EIO`, `ETIMEDOUT`, `ENOLINK` (transport), `EREMOTEIO` (target),
            `ENODATA` (medium), `EBADE` (reservation conflict) or `EILSEQ`
            (protection), or `_OTHER`
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.fs.sync.duration
    type: metric
    metric_name: obi.stat.fs.sync.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Time that threads wait for file syncs to make their data durable, per
      sync type and outcome: the fsync, fdatasync, sync, syncfs and
      sync_file_range (when it waits) system calls from their entry to their
      return, and the syncs that the kernel does within other calls (O_SYNC and
      O_DSYNC writes, msync with MS_SYNC, io_uring fsync). It includes all that
      a sync waits for, such as the writeback of the dirty pages, the journal
      commit, the block I/O and the cache flushes, or the COMMIT RPCs on NFS,
      but not the writeback that the kernel does in the background. The calls
      that sync nothing, on an invalid file descriptor (EBADF) or on a file
      that can't be synced, such as a pipe, a socket or a terminal (EINVAL, or
      ESPIPE for sync_file_range), are not counted. The syncs of kernel
      threads, such as those of the NFS server and of the loop devices that
      sync their backing file, are counted without workload attributes. Its
      workload attributes are opt-in:
      `obi.stat.fs.sync.time` and `obi.stat.fs.sync.operations` give the mean
      per workload.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: obi.fs.sync.type
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: >
            if the file sync failed: its errno name, e.g. `EIO` or `ENOSPC`, or
            `_OTHER`
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.fs.sync.operations
    type: metric
    metric_name: obi.stat.fs.sync.operations
    instrument: counter
    unit: "{operation}"
    stability: development
    brief: >
      Count of the file syncs that `obi.stat.fs.sync.duration` measures, per
      sync type, outcome and workload that the thread that synced belongs to.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: obi.fs.sync.type
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: >
            if the file sync failed: its errno name, e.g. `EIO` or `ENOSPC`, or
            `_OTHER`
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the sync is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the sync is charged to a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the sync is charged to a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.fs.sync.time
    type: metric
    metric_name: obi.stat.fs.sync.time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Sum of the durations of the file syncs that `obi.stat.fs.sync.duration`
      measures, as it measures them, per sync type, outcome and workload that
      the thread that synced belongs to: the sum of that histogram. Like
      `system.cpu.time`, it is a time counter, of the time that threads waited
      for their syncs. Divided by `obi.stat.fs.sync.operations`, both summed by
      the workload attributes, it gives the mean sync time of each workload;
      outside Kubernetes, the histogram gives the same per sync type.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: obi.fs.sync.type
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: >
            if the file sync failed: its errno name, e.g. `EIO` or `ENOSPC`, or
            `_OTHER`
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the sync is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the sync is charged to a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the sync is charged to a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.nfs.client.procedure.duration
    type: metric
    metric_name: obi.stat.nfs.client.procedure.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Time that each RPC of the kernel NFS client takes, from the start of its
      RPC task to its completion, per server, procedure, NFS version and
      outcome: the wait for a transport slot, the transmissions, the
      retransmissions and the server's reply. It is the execute time of
      /proc/self/mountstats (nfsiostat's avg exe), which includes the
      round-trip time, not the round-trip time alone. For NFSv4,
      `onc_rpc.procedure.name` is the name that the kernel client gives to
      each kind of COMPOUND request, after its main operation, e.g. `READ` or
      `OPEN`.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level: recommended
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: >
            if the RPC failed: its errno name, e.g. `EIO`, `ENOENT` (no such
            file) or `EJUKEBOX`, the name of its NFSv4 status, e.g.
            `NFS4ERR_DELAY`, or `_OTHER`

  - id: metric.obi.obi.stat.nfs.client.io
    type: metric
    metric_name: obi.stat.nfs.client.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      File data that the READ and WRITE RPCs of the kernel NFS client
      transferred, per server and direction (`receive`: read from the server,
      `transmit`: written to it): the bytes that the server read and wrote, as
      /proc/self/mountstats counts them, without the RPC headers and the other
      procedures.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: network.io.direction
        requirement_level: recommended
