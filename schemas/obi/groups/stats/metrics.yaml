    metric_name: obi.stat.disk.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Duration of block I/O requests, from their issue to the device until
      their completion, per block device, direction and outcome. It is not
      reported on the paths of dm-multipath devices, nor, when
      `stats_disk_bio_devices` measures the NVMe native multipath heads, on
      their paths: the multipath device reports the same I/O.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the block I/O request failed
