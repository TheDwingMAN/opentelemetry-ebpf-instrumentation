  # Disk / storage block-layer stats. Emitted when the `storage_block`
  # feature is enabled. Both attributes are reused from upstream semconv
  # (`system.device` + `disk.io.direction`), so no OBI-specific attribute is
  # introduced here. The metric name follows the OBI `obi.stat.*` convention
  # used by the TCP stats above, rather than the upstream `system.disk.*`
  # namespace.
  #
  # `operation.duration` rather than `io.latency`: semconv reserves `duration`
  # for a histogram of a discrete operation's elapsed time, and a name must not
  # be both a leaf and a namespace -- `obi.stat.disk.io` is a metric in its own
  # right below.
  - id: metric.obi.obi.stat.disk.operation.duration
    type: metric
    metric_name: obi.stat.disk.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Block-layer service latency per disk read or write request, measured
      from `block_rq_issue` to `block_rq_complete`, broken down by device and
      direction. Flush and discard requests are not included: they have
      metrics of their own. The write count matches the writes in
      `/proc/diskstats`, except that diskstats also counts as a write an empty
      preflush write (0 bytes, such as a dm-thin metadata commit or a flush
      passed through a loop device), counted here only as the flush issued for
      it, and a secure erase, counted here as a discard.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended

  # Companion to the latency histogram above: the volume of data moved by the
  # same block requests. Shares the `storage_block` feature gate and attribute
  # set, so enabling the feature yields both metrics.
  #
  # This carries the same semantics as upstream semconv's `system.disk.io` but
  # is published under the OBI namespace on purpose: emitting `system.disk.io`
  # would collide with the OTel Collector's `hostmetrics` receiver, which
  # publishes that metric with these same attributes, so a host running both
  # agents would get two writers on one series.
  #
  # The unit is not repeated in the metric name: semconv states that metrics
  # carrying their unit in OTEL metadata SHOULD NOT include it in the name.
  - id: metric.obi.obi.stat.disk.io
    type: metric
    metric_name: obi.stat.disk.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes transferred at the block layer, accumulated per completed
      disk read or write request and broken down by device and direction.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended

  # Companion to the service-time histogram above, but for the other half of a
  # request's lifetime: how long it waited before being dispatched. Requires
  # the `block_rq_insert` tracepoint in addition to `block_rq_issue` /
  # `block_rq_complete`, gated separately as `storage_block_queue` since it is
  # extra kernel-side overhead the base duration/io metrics don't pay.
  - id: metric.obi.obi.stat.disk.queue.duration
    type: metric
    metric_name: obi.stat.disk.queue.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Time a disk read or write request spent queued before being dispatched
      to the device, measured from `block_rq_insert` to `block_rq_issue`,
      broken down by device and direction. Requests that blk-mq issues directly, without
      passing through `block_rq_insert`, are not observed: they have no queue
      wait to report and recording a zero would understate the distribution.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended

  # Queue depth, not queue latency: the count of requests still in flight on
  # the device immediately after this one completed. Observed once per
  # completion rather than time-averaged, so it approximates instantaneous
  # saturation rather than a true utilization integral. Emitted only with its
  # own `storage_block_queue_depth` feature, outside the `storage_block`
  # umbrella and `*`/`all`: it is the one block metric that needs a counter
  # shared by every CPU on the block path.
  - id: metric.obi.obi.stat.disk.queue.depth
    type: metric
    metric_name: obi.stat.disk.queue.depth
    instrument: histogram
    unit: "{operation}"
    stability: development
    deprecated:
      reason: obsoleted
      note: >
        The `storage_block_queue_depth` metrics feature that emits this
        histogram is deprecated with no replacement.
    brief: >
      Number of block I/O requests still in flight on the device immediately
      after this request completed, observed per read or write completion and
      broken down by device.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended

  # Failed completions, keyed by the upstream error.type attribute so the
  # failure mode (ENOSPC, EIO, ...) is queryable without an OBI-specific
  # attribute. Emitted when the `storage_block_errors` feature is enabled.
  - id: metric.obi.obi.stat.disk.operation.errors
    type: metric
    metric_name: obi.stat.disk.operation.errors
    instrument: counter
    unit: "{error}"
    stability: development
    brief: >
      Count of block read and write requests that completed with a non-zero
      error, broken down by device, direction and errno. Failed flushes and
      discards carry `error.type` on their own duration histograms.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: error.type
        requirement_level: recommended

  # Cache flushes (REQ_OP_FLUSH): what fsync and fdatasync wait for at the
  # device. A flush moves no data, so it has no direction and is not counted
  # as a write. A write that carries a preflush is a write; the flush the
  # kernel issues for it is counted here. Emitted when the
  # `storage_block_flush` feature is enabled. Failures are not counted in a
  # separate metric: `error.type` is set on the histogram when the flush
  # failed, and absent when it succeeded.
  - id: metric.obi.obi.stat.disk.flush.duration
    type: metric
    metric_name: obi.stat.disk.flush.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Block-layer service time of cache flush requests, measured from
      `block_rq_issue` to `block_rq_complete`, broken down by device. The
      count matches the flushes in `/proc/diskstats`.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the flush failed

  # Discards (REQ_OP_DISCARD, and REQ_OP_SECURE_ERASE): blocks released by an
  # fstrim, a `discard` mount option or an LV removal. They move no data, so
  # they are neither reads nor writes. Emitted with the duration histogram
  # below when the `storage_block_discard` feature is enabled.
  - id: metric.obi.obi.stat.disk.discard.duration
    type: metric
    metric_name: obi.stat.disk.discard.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Block-layer service time of discard and secure erase requests, measured
      from `block_rq_issue` to `block_rq_complete`, broken down by device.
      `/proc/diskstats` counts a secure erase as a write instead.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the discard failed

  - id: metric.obi.obi.stat.disk.discard.io
    type: metric
    metric_name: obi.stat.disk.discard.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes released by discard and secure erase requests that
      completed successfully, broken down by device.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended

  # Filesystem stats. Emitted when the `storage_fs` feature is enabled.
  # Probes attach to each of the seven supported filesystems' (nfs, ceph,
  # cifs, fuse, ext4, xfs, btrfs) own file_operations read, write and fsync
  # implementations rather than to generic VFS, so a node not using a given
  # filesystem pays nothing for it.
  #
  # system.filesystem.type is an open enum upstream (the semconv member list
  # is fat32, exfat, ntfs, refs, hfsplus, ext4): OBI emits nfs, ceph, cifs,
  # fuse, xfs and btrfs in addition to the upstream ext4 member.
  #
  # Semantics note: buffered writes return once data is in the page cache, so
  # this is application-perceived latency, not server round-trip time -- the
  # RPC happens later on a writeback thread.
  - id: metric.obi.obi.stat.fs.operation.duration
    type: metric
    metric_name: obi.stat.fs.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Latency of a single filesystem read, write, fsync or fdatasync as the
      application experiences it, broken down by filesystem type and
      operation. Buffered writes (no O_SYNC, O_DIRECT or fsync) end once the
      data is in the page cache, so their latency is the copy into memory; the
      server's or device's latency shows in fsync and fdatasync.
    attributes:
      - ref: system.filesystem.type
        requirement_level: recommended
      - ref: fs.operation
        requirement_level: recommended

  # Companion to the histogram above: volume of data moved by the same
  # operations. Published under obi.* rather than system.filesystem.* so it
  # cannot double-count against the Collector's hostmetrics receiver.
  - id: metric.obi.obi.stat.fs.io
    type: metric
    metric_name: obi.stat.fs.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes transferred through filesystem read and write
      operations, broken down by filesystem type and operation.
    attributes:
      - ref: system.filesystem.type
        requirement_level: recommended
      - ref: fs.operation
        requirement_level: recommended

  # Failed filesystem operations, keyed by the upstream error.type attribute so
  # the failure mode (ESTALE, EIO, ENOSPC, ETIMEDOUT, ...) is queryable without
  # an OBI-specific attribute. Emitted when the `storage_fs_errors` feature is
  # enabled. The async io_uring completion marker (-EIOCBQUEUED) is excluded at
  # the probe: it is not a failure, just a deferred completion OBI does not
  # observe.
  - id: metric.obi.obi.stat.fs.operation.errors
    type: metric
    metric_name: obi.stat.fs.operation.errors
    instrument: counter
    unit: "{error}"
    stability: development
    brief: >
      Count of filesystem read or write operations that failed,
      broken down by filesystem type, operation and errno.
    attributes:
      - ref: system.filesystem.type
        requirement_level: recommended
      - ref: fs.operation
        requirement_level: recommended
      - ref: error.type
        requirement_level: recommended
