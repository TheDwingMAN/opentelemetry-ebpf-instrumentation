  - id: metric.obi.obi.stat.disk.service_time
    type: metric
    metric_name: obi.stat.disk.service_time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Sum of the device service times of the completed block reads and writes,
      as `obi.stat.disk.operation.duration` measures them, per block device,
      direction, outcome and workload the I/O is charged to. Unlike
      `system.disk.operation_time` (/proc/diskstats), it excludes the wait in
      the I/O scheduler: plus `obi.stat.disk.queue_time`, it is the time that
      /proc/diskstats counts for the reads and writes. Divided by
      `obi.stat.disk.operations`, both summed by the same attributes, it is the
      mean service time, and, added to `obi.stat.disk.queue_time` first,
      iostat's r_await or w_await. Its rate is the average number of requests
      that the device serves at once, above 1 on devices that serve requests
      in parallel.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.volume.name
        requirement_level:
          conditionally_required: if the block device is a device mapper device
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the block I/O request failed

  - id: metric.obi.obi.stat.fs.sync.duration
    type: metric
    metric_name: obi.stat.fs.sync.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Time that threads wait for file syncs to make their data durable, per
      sync type and outcome: the fsync, fdatasync, sync, syncfs and
      sync_file_range (when it waits) system calls from their entry to their
      return, and the syncs that the kernel does within other calls (O_SYNC and
      O_DSYNC writes, msync with MS_SYNC, io_uring fsync). It includes all that
      a sync waits for, such as the writeback of the dirty pages, the journal
      commit, the block I/O and the cache flushes, or the COMMIT RPCs on NFS,
      but not the writeback that the kernel does in the background. Its
      workload attributes are opt-in: `obi.stat.fs.sync.operation_time` and
      `obi.stat.fs.sync.operations` give the mean per workload.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the file sync failed
      - ref: obi.fs.sync.type
        requirement_level: recommended
      - ref: system.filesystem.mountpoint
        requirement_level: opt_in
      - ref: system.filesystem.type
        requirement_level: opt_in
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.fs.sync.operations
    type: metric
    metric_name: obi.stat.fs.sync.operations
    instrument: counter
    unit: "{operation}"
    stability: development
    brief: >
      Completed file syncs, those of `obi.stat.fs.sync.duration`, per sync
      type, outcome and workload whose thread synced.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: obi.fs.sync.type
        requirement_level: recommended
      - ref: system.filesystem.mountpoint
        requirement_level: opt_in
      - ref: system.filesystem.type
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the file sync failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that synced runs in a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that synced runs in a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that synced runs in a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.fs.sync.operation_time
    type: metric
    metric_name: obi.stat.fs.sync.operation_time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Sum of the durations of the completed file syncs, as
      `obi.stat.fs.sync.duration` measures them, per sync type, outcome and
      workload whose thread synced. Divided by `obi.stat.fs.sync.operations`,
      both summed by the same attributes, it is the mean sync time; its rate
      is the average number of syncs in progress.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: obi.fs.sync.type
        requirement_level: recommended
      - ref: system.filesystem.mountpoint
        requirement_level: opt_in
      - ref: system.filesystem.type
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the file sync failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that synced runs in a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that synced runs in a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that synced runs in a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.queue_time
    type: metric
    metric_name: obi.stat.disk.queue_time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Sum of the time that the completed block reads and writes waited between
      their allocation (from Linux 6.13, the start of their accounting) and
      their issue to the device, in the I/O scheduler or the dispatch queues,
      per block device, direction, outcome and workload the I/O is charged to.
      For a write that must follow a cache flush (a journal commit), it
      includes that flush. Waits before the allocation, such as those of
      blk-throttle (io.max) and of writeback throttling, are not included.
      Plus `obi.stat.disk.service_time`, divided by `obi.stat.disk.operations`,
      it gives iostat's r_await or w_await of each device or workload, and the
      rate of the sum of both time counters is iostat's aqu-sz for the reads
      and writes, without the flushes and discards. The wait is measured for
      the requests that the kernel accounts in /proc/diskstats, those of
      devices that keep I/O statistics, and, on Linux 6.10 and earlier and RHEL
      8 (but not RHEL 9.6), for those of devices that use an I/O scheduler.
      Nothing is added for the other requests, whose ratio is then their
      service time, nor for the bios of bio-based devices (LVM, md RAID, zram)
      and the empty flush writes of file syncs, which are timed from their
      submission or allocation, so that their service time holds their wait.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.volume.name
        requirement_level:
          conditionally_required: if the block device is a device mapper device
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the block I/O request failed

  - id: metric.obi.obi.stat.disk.flush.duration
    type: metric
    metric_name: obi.stat.disk.flush.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Duration of the cache flush requests of block devices, from their issue
      to the device until their completion, per block device and outcome. The
      flushes of bio-based devices (such as LVM, md RAID and NVMe native
      multipath heads), which issue no requests of their own, are timed from
      the submission of their bio. It is not reported on the paths of
      dm-multipath devices: the multipath device reports the same flushes.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.volume.name
        requirement_level:
          conditionally_required: if the block device is a device mapper device
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the request failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.discard.duration
