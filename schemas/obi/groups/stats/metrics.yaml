      - ref: src.address
        requirement_level: recommended
      - ref: dst.address
        requirement_level: recommended
      - ref: src.port
        requirement_level: opt_in
      - ref: dst.port
        requirement_level: opt_in
      - ref: src.name
        requirement_level: opt_in
      - ref: dst.name
        requirement_level: opt_in
      - ref: src.zone
        requirement_level: opt_in
      - ref: dst.zone
        requirement_level: opt_in
      - ref: reason
        requirement_level: opt_in
      - ref: network.tcp.handshake.role
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.name
        requirement_level: opt_in
      - ref: k8s.src.type
        requirement_level: opt_in
      - ref: k8s.src.node.ip
        requirement_level: opt_in
      - ref: k8s.src.node.name
        requirement_level: opt_in
      - ref: k8s.dst.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.name
        requirement_level: opt_in
      - ref: k8s.dst.type
        requirement_level: opt_in
      - ref: k8s.dst.node.ip
        requirement_level: opt_in
      - ref: k8s.dst.node.name
        requirement_level: opt_in
      - ref: service.name
        requirement_level: opt_in
      - ref: service.namespace
        requirement_level: opt_in
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: service.peer.namespace
        requirement_level: opt_in

  - name: obi.stat.tcp.successful.connections
    instrument: counter
    unit: ""
    stability: development
    requirement_level: recommended
    brief: >
      Count of TCP connections that completed the three-way handshake,
      broken down by `network.tcp.handshake.role`.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: src.address
        requirement_level: recommended
      - ref: dst.address
        requirement_level: recommended
      - ref: src.port
        requirement_level: opt_in
      - ref: dst.port
        requirement_level: opt_in
      - ref: src.name
        requirement_level: opt_in
      - ref: dst.name
        requirement_level: opt_in
      - ref: src.zone
        requirement_level: opt_in
      - ref: dst.zone
        requirement_level: opt_in
      - ref: network.tcp.handshake.role
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.name
        requirement_level: opt_in
      - ref: k8s.src.type
        requirement_level: opt_in
      - ref: k8s.src.node.ip
        requirement_level: opt_in
      - ref: k8s.src.node.name
        requirement_level: opt_in
      - ref: k8s.dst.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.name
        requirement_level: opt_in
      - ref: k8s.dst.type
        requirement_level: opt_in
      - ref: k8s.dst.node.ip
        requirement_level: opt_in
      - ref: k8s.dst.node.name
        requirement_level: opt_in
      - ref: service.name
        requirement_level: opt_in
      - ref: service.namespace
        requirement_level: opt_in
      - ref: service.peer.name
        requirement_level: opt_in
