groups:
  - id: metric.obi.obi.stat.tcp.rtt
    type: metric
    metric_name: obi.stat.tcp.rtt
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Smoothed round-trip time observed per TCP connection.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: src.address
        requirement_level: recommended
      - ref: dst.address
        requirement_level: recommended
      - ref: src.port
        requirement_level: opt_in
      - ref: dst.port
        requirement_level: opt_in
      - ref: src.name
        requirement_level: opt_in
      - ref: dst.name
        requirement_level: opt_in
      - ref: src.zone
        requirement_level: opt_in
      - ref: dst.zone
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.name
        requirement_level: opt_in
      - ref: k8s.src.type
        requirement_level: opt_in
      - ref: k8s.src.node.ip
        requirement_level: opt_in
      - ref: k8s.src.node.name
        requirement_level: opt_in
      - ref: k8s.dst.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.name
        requirement_level: opt_in
      - ref: k8s.dst.type
        requirement_level: opt_in
      - ref: k8s.dst.node.ip
        requirement_level: opt_in
      - ref: k8s.dst.node.name
        requirement_level: opt_in
      - ref: service.name
        requirement_level: opt_in
      - ref: service.namespace
        requirement_level: opt_in
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: service.peer.namespace
        requirement_level: opt_in
      - ref: network.tcp.handshake.role
        requirement_level: opt_in

  - id: metric.obi.obi.stat.tcp.retransmits
    type: metric
    metric_name: obi.stat.tcp.retransmits
    instrument: counter
    unit: ""
    stability: development
    brief: >
      Count of TCP retransmissions observed per connection.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: src.address
        requirement_level: recommended
      - ref: dst.address
        requirement_level: recommended
      - ref: src.port
        requirement_level: opt_in
      - ref: dst.port
        requirement_level: opt_in
      - ref: src.name
        requirement_level: opt_in
      - ref: dst.name
        requirement_level: opt_in
      - ref: src.zone
        requirement_level: opt_in
      - ref: dst.zone
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.name
        requirement_level: opt_in
      - ref: k8s.src.type
        requirement_level: opt_in
      - ref: k8s.src.node.ip
        requirement_level: opt_in
      - ref: k8s.src.node.name
        requirement_level: opt_in
      - ref: k8s.dst.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.name
        requirement_level: opt_in
      - ref: k8s.dst.type
        requirement_level: opt_in
      - ref: k8s.dst.node.ip
        requirement_level: opt_in
      - ref: k8s.dst.node.name
        requirement_level: opt_in
      - ref: service.name
        requirement_level: opt_in
      - ref: service.namespace
        requirement_level: opt_in
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: service.peer.namespace
        requirement_level: opt_in

  - id: metric.obi.obi.stat.tcp.io
    type: metric
    metric_name: obi.stat.tcp.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes transferred at the socket layer per TCP connection,
      broken down by direction.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: src.address
        requirement_level: recommended
      - ref: dst.address
        requirement_level: recommended
      - ref: src.port
        requirement_level: opt_in
      - ref: dst.port
        requirement_level: opt_in
      - ref: src.name
        requirement_level: opt_in
      - ref: dst.name
        requirement_level: opt_in
      - ref: src.zone
        requirement_level: opt_in
      - ref: dst.zone
        requirement_level: opt_in
      - ref: network.io.direction
        requirement_level: recommended
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.name
        requirement_level: opt_in
      - ref: k8s.src.type
        requirement_level: opt_in
      - ref: k8s.src.node.ip
        requirement_level: opt_in
      - ref: k8s.src.node.name
        requirement_level: opt_in
      - ref: k8s.dst.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.name
        requirement_level: opt_in
      - ref: k8s.dst.type
        requirement_level: opt_in
      - ref: k8s.dst.node.ip
        requirement_level: opt_in
      - ref: k8s.dst.node.name
        requirement_level: opt_in
      - ref: service.name
        requirement_level: opt_in
      - ref: service.namespace
        requirement_level: opt_in
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: service.peer.namespace
        requirement_level: opt_in

  # Counter has no explicit OTLP unit set; mirror that here so live-check
  # doesn't complain "Unit should be '1', but found ''".
  - id: metric.obi.obi.stat.tcp.failed.connections
    type: metric
    metric_name: obi.stat.tcp.failed.connections
    instrument: counter
    unit: ""
    stability: development
    brief: >
      Count of TCP connections that failed to establish, broken down by
      `reason`.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: src.address
        requirement_level: recommended
      - ref: dst.address
        requirement_level: recommended
      - ref: src.port
        requirement_level: opt_in
      - ref: dst.port
        requirement_level: opt_in
      - ref: src.name
        requirement_level: opt_in
      - ref: dst.name
        requirement_level: opt_in
      - ref: src.zone
        requirement_level: opt_in
      - ref: dst.zone
        requirement_level: opt_in
      - ref: reason
        requirement_level: opt_in
      - ref: network.tcp.handshake.role
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.name
        requirement_level: opt_in
      - ref: k8s.src.type
        requirement_level: opt_in
      - ref: k8s.src.node.ip
        requirement_level: opt_in
      - ref: k8s.src.node.name
        requirement_level: opt_in
      - ref: k8s.dst.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.name
        requirement_level: opt_in
      - ref: k8s.dst.type
        requirement_level: opt_in
      - ref: k8s.dst.node.ip
        requirement_level: opt_in
      - ref: k8s.dst.node.name
        requirement_level: opt_in
      - ref: service.name
        requirement_level: opt_in
      - ref: service.namespace
        requirement_level: opt_in
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: service.peer.namespace
        requirement_level: opt_in

  - id: metric.obi.obi.stat.tcp.successful.connections
    type: metric
    metric_name: obi.stat.tcp.successful.connections
    instrument: counter
    unit: ""
    stability: development
    brief: >
      Count of TCP connections that completed the three-way handshake,
      broken down by `network.tcp.handshake.role`.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: src.address
        requirement_level: recommended
      - ref: dst.address
        requirement_level: recommended
      - ref: src.port
        requirement_level: opt_in
      - ref: dst.port
        requirement_level: opt_in
      - ref: src.name
        requirement_level: opt_in
      - ref: dst.name
        requirement_level: opt_in
      - ref: src.zone
        requirement_level: opt_in
      - ref: dst.zone
        requirement_level: opt_in
      - ref: network.tcp.handshake.role
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.src.name
        requirement_level: opt_in
      - ref: k8s.src.type
        requirement_level: opt_in
      - ref: k8s.src.node.ip
        requirement_level: opt_in
      - ref: k8s.src.node.name
        requirement_level: opt_in
      - ref: k8s.dst.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.owner.type
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.namespace
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled
      - ref: k8s.dst.name
        requirement_level: opt_in
      - ref: k8s.dst.type
        requirement_level: opt_in
      - ref: k8s.dst.node.ip
        requirement_level: opt_in
      - ref: k8s.dst.node.name
        requirement_level: opt_in
      - ref: service.name
        requirement_level: opt_in
      - ref: service.namespace
        requirement_level: opt_in
      - ref: service.peer.name
        requirement_level: opt_in
      - ref: service.peer.namespace
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.operation.duration
    type: metric
    metric_name: obi.stat.disk.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Duration of block I/O requests, from their issue to the device until
      their completion, per block device, direction and outcome.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the block I/O request failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level: opt_in
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.io
    type: metric
    metric_name: obi.stat.disk.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Bytes transferred by the block I/O requests that completed successfully,
      per block device, direction and workload the I/O is charged to.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.operations
    type: metric
    metric_name: obi.stat.disk.operations
    instrument: counter
    unit: "{operation}"
    stability: development
    brief: >
      Completed block I/O requests, per block device, direction, outcome and
      workload the I/O is charged to.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the block I/O request failed

  - id: metric.obi.obi.stat.disk.operation.time
    type: metric
    metric_name: obi.stat.disk.operation.time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Sum of the durations of the completed block I/O requests, from their
      issue to the device until their completion, per block device, direction
      and workload the I/O is charged to.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.fs.sync.duration
    type: metric
    metric_name: obi.stat.fs.sync.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Duration of file syncs (fsync, fdatasync and their equivalents), per
      outcome and workload that synced.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: error.type
        requirement_level:
          conditionally_required: if the file sync failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that synced runs in a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that synced runs in a pod
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in
