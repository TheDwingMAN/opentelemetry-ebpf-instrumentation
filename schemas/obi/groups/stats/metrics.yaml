  # Disk / storage block-layer stats. Emitted when the `storage_block`
  # feature is enabled. Both attributes are reused from upstream semconv
  # (`system.device` + `disk.io.direction`), so no OBI-specific attribute is
  # introduced here. The metric name follows the OBI `obi.stat.*` convention
  # used by the TCP stats above, rather than the upstream `system.disk.*`
  # namespace.
  #
  # `operation.duration` rather than `io.latency`: semconv reserves `duration`
  # for a histogram of a discrete operation's elapsed time, and a name must not
  # be both a leaf and a namespace -- `obi.stat.disk.io` is a metric in its own
  # right below.
  - id: metric.obi.obi.stat.disk.operation.duration
    type: metric
    metric_name: obi.stat.disk.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Block-layer service latency per disk read or write request, measured
      from `block_rq_issue` to `block_rq_complete`, broken down by device and
      direction. Flush and discard requests are not included: they have
      metrics of their own. The write count matches the writes in
      `/proc/diskstats`, except that diskstats also counts as a write an empty
      preflush write (0 bytes, such as a dm-thin metadata commit or a flush
      passed through a loop device), counted here only as the flush issued for
      it, and a secure erase, counted here as a discard. With the
      `storage_block_volumes` feature, a bio-based stacked volume (an LVM
      logical volume, an md array, a dm-crypt device) is a device of its own
      in every `obi.stat.disk.*` metric, measured per bio from
      `block_bio_queue` to `block_bio_complete`: the end-to-end time of the
      bio as it was submitted to the volume, counted once however its driver
      splits it. `/proc/diskstats` of device-mapper and md devices counts the
      fragments instead, so compare bytes, which match, rather than operation
      counts.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: obi.disk.partition
        requirement_level: opt_in

  # Companion to the latency histogram above: the volume of data moved by the
  # same block requests. Shares the `storage_block` feature gate and attribute
  # set, so enabling the feature yields both metrics.
  #
  # This carries the same semantics as upstream semconv's `system.disk.io` but
  # is published under the OBI namespace on purpose: emitting `system.disk.io`
  # would collide with the OTel Collector's `hostmetrics` receiver, which
  # publishes that metric with these same attributes, so a host running both
  # agents would get two writers on one series.
  #
  # The unit is not repeated in the metric name: semconv states that metrics
  # carrying their unit in OTEL metadata SHOULD NOT include it in the name.
  - id: metric.obi.obi.stat.disk.io
    type: metric
    metric_name: obi.stat.disk.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes transferred at the block layer, accumulated per completed
      disk read or write request and broken down by device and direction.
      With `storage_block_pod`, also by the pod the I/O is charged to (see
      `obi.stat.disk.operations`); I/O charged to no pod is a series without
      pod attributes.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: k8s.namespace.name
        requirement_level:
          recommended: with storage_block_pod, if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.pod.name
        requirement_level:
          recommended: with storage_block_pod, if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: with storage_block_pod, if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in

  # Companion to the service-time histogram above, but for the other half of a
  # request's lifetime: how long it waited before being dispatched. Read from
  # the request's accounting start at `block_rq_issue`, so it needs no extra
  # tracepoint; gated separately as `storage_block_queue`.
  - id: metric.obi.obi.stat.disk.queue.duration
    type: metric
    metric_name: obi.stat.disk.queue.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Time a disk read or write request spent queued, from the request's
      accounting start (`start_time_ns`, set after the tag or scheduler-tag
      allocation and shared by all requests of a plug batch) to dispatch to
      the driver. Nothing is recorded for a device with `queue/iostats=0`, for
      the data write of a flush sequence (PREFLUSH or FUA on a device without
      FUA), nor on a kernel whose BTF has no `enum rqf_flags` or that uses the
      classic block tracepoints (OBI logs a warning at start), so the count
      can be lower than `obi.stat.disk.operation.duration`'s. A stacked volume
      measured with `storage_block_volumes` has no queue wait of its own: what
      its bios wait for is part of their operation duration.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: obi.disk.partition
        requirement_level: opt_in

  # Queue depth, not queue latency: the count of requests still in flight on
  # the device immediately after this one completed. Observed once per
  # completion rather than time-averaged, so it approximates instantaneous
  # saturation rather than a true utilization integral. Emitted only with its
  # own `storage_block_queue_depth` feature, outside the `storage_block`
  # umbrella and `*`/`all`: it is the one block metric that needs a counter
  # shared by every CPU on the block path.
  - id: metric.obi.obi.stat.disk.queue.depth
    type: metric
    metric_name: obi.stat.disk.queue.depth
    instrument: histogram
    unit: "{operation}"
    stability: development
    deprecated:
      reason: obsoleted
      note: >
        The `storage_block_queue_depth` metrics feature that emits this
        histogram is deprecated with no replacement.
    brief: >
      Number of block I/O requests still in flight on the device immediately
      after this request completed, observed per read or write completion and
      broken down by device.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled

  # Failed completions, keyed by the upstream error.type attribute so the
  # failure mode (ENOSPC, EIO, ...) is queryable without an OBI-specific
  # attribute. Emitted when the `storage_block_errors` feature is enabled.
  - id: metric.obi.obi.stat.disk.operation.errors
    type: metric
    metric_name: obi.stat.disk.operation.errors
    instrument: counter
    unit: "{error}"
    stability: development
    brief: >
      Count of block read and write requests that completed with a non-zero
      error, broken down by device, direction and errno. Failed flushes and
      discards carry `error.type` on their own duration histograms.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: error.type
        requirement_level: recommended
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: obi.disk.partition
        requirement_level: opt_in

  # Cache flushes (REQ_OP_FLUSH): what fsync and fdatasync wait for at the
  # device. A flush moves no data, so it has no direction and is not counted
  # as a write. A write that carries a preflush is a write; the flush the
  # kernel issues for it is counted here. Emitted when the
  # `storage_block_flush` feature is enabled. Failures are not counted in a
  # separate metric: `error.type` is set on the histogram when the flush
  # failed, and absent when it succeeded.
  - id: metric.obi.obi.stat.disk.flush.duration
    type: metric
    metric_name: obi.stat.disk.flush.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Block-layer service time of cache flush requests, measured from
      `block_rq_issue` to `block_rq_complete`, broken down by device. The
      count matches the flushes in `/proc/diskstats`. On a stacked volume
      measured with `storage_block_volumes`, a flush is the empty preflush
      write submitted to the volume; `/proc/diskstats` never counts it as a
      flush there (device-mapper counts it as a write of 0 bytes, md not at
      all).
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the flush failed
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled

  # Discards (REQ_OP_DISCARD, and REQ_OP_SECURE_ERASE): blocks released by an
  # fstrim, a `discard` mount option or an LV removal. They move no data, so
  # they are neither reads nor writes. Emitted with the duration histogram
  # below when the `storage_block_discard` feature is enabled.
  - id: metric.obi.obi.stat.disk.discard.duration
    type: metric
    metric_name: obi.stat.disk.discard.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Block-layer service time of discard and secure erase requests, measured
      from `block_rq_issue` to `block_rq_complete`, broken down by device.
      `/proc/diskstats` counts a secure erase as a write instead.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the discard failed
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: obi.disk.partition
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.discard.io
    type: metric
    metric_name: obi.stat.disk.discard.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes released by discard and secure erase requests that
      completed successfully, broken down by device.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: obi.disk.partition
        requirement_level: opt_in

  # Point-in-time count of requests still in flight on the device, from a
  # userspace batch snapshot of the kernel's in-flight map taken once per
  # collection (D10), rather than a counter the issue/complete path updates:
  # unlike the deprecated `obi.stat.disk.queue.depth`, it costs nothing in
  # the hot path. Gated by its own `storage_block_pending` feature, inside
  # the `storage_block` umbrella. Named after the OTel Collector hostmetrics
  # receiver's `system.disk.pending_operations`; not in upstream semconv.
  # disk.io.direction does not apply to a flush or discard entry (a
  # point-in-time snapshot has no direction for them), so it defaults off.
  - id: metric.obi.obi.stat.disk.pending_operations
    type: metric
    metric_name: obi.stat.disk.pending_operations
    instrument: updowncounter
    unit: "{operation}"
    stability: development
    brief: >
      Count of block I/O requests still in flight on the device right now,
      from a snapshot of the kernel's in-flight map taken once per
      collection, broken down by device. A device with no request in flight
      reports 0 until it has gone idle past the metric's reporting interval.
      With `storage_block_volumes`, the bios in flight on a stacked volume are
      its pending operations.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: opt_in
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: obi.disk.partition
        requirement_level: opt_in
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled

  # Pod attribution of block I/O, behind the opt-in `storage_block_pod`
  # (spec 2.3): counted in the kernel per cgroup the request's bio is charged
  # to (its blkcg), never per task, so I/O issued by kernel threads on a
  # pod's behalf keeps the pod. Read/write only, no histograms per pod.
  # Requires cgroup v2 with the io controller.
  - id: metric.obi.obi.stat.disk.operations
    type: metric
    metric_name: obi.stat.disk.operations
    instrument: counter
    unit: "{operation}"
    stability: development
    brief: >
      Count of completed block read and write requests, broken down by
      device, direction and the pod the I/O is charged to. Reads and direct
      I/O are charged to the submitting container; buffered writes, whether
      flushed by the kernel or by fsync, to the cgroup that owns the file's
      writeback domain: normally the container that created the file, then
      the dominant writer after some writeback rounds, then the pod or QoS
      slice once the container is removed. I/O charged to no pod (kernel
      threads such as the ext4 journal, system services) is a series without
      pod attributes, so the series of a device and direction add up to all
      of its reads or writes.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.pod.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in

  # The time counterpart of obi.stat.disk.operations, with the semantics of
  # semconv's system.disk.operation_time (diskstats fields 7 and 11). A
  # counter in seconds, not a histogram: per-pod histograms would multiply
  # the series by the buckets.
  - id: metric.obi.obi.stat.disk.operation_time
    type: metric
    metric_name: obi.stat.disk.operation_time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Time spent on the block reads and writes of obi.stat.disk.operations,
      summed: from the request's block-layer accounting start to its
      completion, or from its issue to the driver when the device does not
      account it (queue/iostats=0) or for a write in a flush sequence; a
      stacked volume's bio from its submission. Broken down by device,
      direction and the pod the I/O is charged to.
    attributes:
      - ref: system.device
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.pod.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the I/O is charged to a pod
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in

  # Filesystem stats. Emitted when the `storage_fs` feature is enabled.
  # Probes attach to each of the seven supported filesystems' (nfs, ceph,
  # cifs, fuse, ext4, xfs, btrfs) own file_operations read, write and fsync
  # implementations rather than to generic VFS, so a node not using a given
  # filesystem pays nothing for it.
  #
  # system.filesystem.type is an open enum upstream (the semconv member list
  # is fat32, exfat, ntfs, refs, hfsplus, ext4): OBI emits nfs, ceph, cifs,
  # fuse, xfs and btrfs in addition to the upstream ext4 member.
  #
  # Semantics note: buffered writes return once data is in the page cache, so
  # this is application-perceived latency, not server round-trip time -- the
  # RPC happens later on a writeback thread.
  - id: metric.obi.obi.stat.fs.operation.duration
    type: metric
    metric_name: obi.stat.fs.operation.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Latency of a single filesystem read, write, fsync, fdatasync, sync,
      syncfs or sync_file_range as the application experiences it, broken
      down by filesystem type and operation. Buffered writes (no O_SYNC,
      O_DIRECT or fsync) end once the data is in the page cache, so their
      latency is the copy into memory; the server's or device's latency
      shows in fsync, fdatasync and the sync syscalls (`storage_fs_sync`,
      waiting `sync_file_range` calls only, D7).
    attributes:
      - ref: system.filesystem.type
        requirement_level: recommended
      - ref: fs.operation
        requirement_level: recommended
      - ref: system.device
        requirement_level: recommended
        note: Block-backed filesystems only; omitted for network filesystems.
      - ref: obi.disk.physical_device
        requirement_level: recommended
        note: Block-backed filesystems only; omitted for network filesystems.
      - ref: server.address
        requirement_level: recommended
        note: Network filesystems only (nfs, cifs); omitted for ceph and local filesystems.
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.pod.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.container.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.persistentvolume.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the volume is a known PersistentVolume
      - ref: k8s.persistentvolumeclaim.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the PersistentVolume is Bound
      - ref: k8s.storageclass.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the PersistentVolume is Bound
      - ref: system.filesystem.mountpoint
        requirement_level: opt_in
        note: >
          The kubelet's mount path of the volume on the host, never the
          container's (see `obi.fs.container.mountpoint`). The pod's own
          mount for a ReadWriteMany volume. Omitted when the I/O went
          through no kubelet volume, and for `sync`.
      - ref: obi.fs.container.mountpoint
        requirement_level: opt_in

  # Companion to the histogram above: volume of data moved by the same
  # operations. Published under obi.* rather than system.filesystem.* so it
  # cannot double-count against the Collector's hostmetrics receiver.
  - id: metric.obi.obi.stat.fs.io
    type: metric
    metric_name: obi.stat.fs.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of bytes transferred through filesystem read and write
      operations, broken down by filesystem type and operation.
    attributes:
      - ref: system.filesystem.type
        requirement_level: recommended
      - ref: fs.operation
        requirement_level: recommended
      - ref: system.device
        requirement_level: recommended
        note: Block-backed filesystems only; omitted for network filesystems.
      - ref: obi.disk.physical_device
        requirement_level: recommended
        note: Block-backed filesystems only; omitted for network filesystems.
      - ref: server.address
        requirement_level: recommended
        note: Network filesystems only (nfs, cifs); omitted for ceph and local filesystems.
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.pod.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.container.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.persistentvolume.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the volume is a known PersistentVolume
      - ref: k8s.persistentvolumeclaim.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the PersistentVolume is Bound
      - ref: k8s.storageclass.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the PersistentVolume is Bound
      - ref: system.filesystem.mountpoint
        requirement_level: opt_in
        note: >
          The kubelet's mount path of the volume on the host, never the
          container's (see `obi.fs.container.mountpoint`). The pod's own
          mount for a ReadWriteMany volume. Omitted when the I/O went
          through no kubelet volume, and for `sync`.
      - ref: obi.fs.container.mountpoint
        requirement_level: opt_in

  # Failed filesystem operations, keyed by the upstream error.type attribute so
  # the failure mode (ESTALE, EIO, ENOSPC, ETIMEDOUT, ...) is queryable without
  # an OBI-specific attribute. Emitted when the `storage_fs_errors` feature is
  # enabled. The async io_uring completion marker (-EIOCBQUEUED) is excluded at
  # the probe: it is not a failure, just a deferred completion OBI does not
  # observe.
  - id: metric.obi.obi.stat.fs.operation.errors
    type: metric
    metric_name: obi.stat.fs.operation.errors
    instrument: counter
    unit: "{error}"
    stability: development
    brief: >
      Count of filesystem read or write operations that failed,
      broken down by filesystem type, operation and errno.
    attributes:
      - ref: system.filesystem.type
        requirement_level: recommended
      - ref: fs.operation
        requirement_level: recommended
      - ref: error.type
        requirement_level: recommended
      - ref: system.device
        requirement_level: recommended
        note: Block-backed filesystems only; omitted for network filesystems.
      - ref: obi.disk.physical_device
        requirement_level: recommended
        note: Block-backed filesystems only; omitted for network filesystems.
      - ref: server.address
        requirement_level: recommended
        note: Network filesystems only (nfs, cifs); omitted for ceph and local filesystems.
      - ref: k8s.node.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.pod.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.container.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.owner.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the pod is known
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.persistentvolume.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the volume is a known PersistentVolume
      - ref: k8s.persistentvolumeclaim.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the PersistentVolume is Bound
      - ref: k8s.storageclass.name
        requirement_level:
          conditionally_required: if Kubernetes decoration is enabled and the PersistentVolume is Bound
      - ref: system.filesystem.mountpoint
        requirement_level: opt_in
        note: >
          The kubelet's mount path of the volume on the host, never the
          container's (see `obi.fs.container.mountpoint`). The pod's own
          mount for a ReadWriteMany volume. Omitted when the I/O went
          through no kubelet volume, and for `sync`.
      - ref: obi.fs.container.mountpoint
        requirement_level: opt_in

  # NFS client RPC stats. Emitted when the `storage_nfs` feature (or one of
  # `storage_nfs_duration`, `storage_nfs_errors`, `storage_nfs_retransmits`)
  # is enabled; `storage_fs` does not imply it. Counted in the kernel from the
  # sunrpc `rpc_stats_latency` tracepoint, once per RPC attempt, which is how
  # /proc/self/mountstats counts `ops` and `errors`. Not
  # rpc.client.call.duration: OBI emits that one for application-level ONC
  # RPC, and an NFS client RPC is made by the kernel, not by an application.
  #
  # NFSv2/v3 RPCs carry onc_rpc.procedure.name; NFSv4 RPCs, whose wire
  # procedure is always COMPOUND, carry nfs.operation.name instead (the
  # client operation, such as READ, OPEN or OPEN_NOATTR).
  - id: metric.obi.obi.stat.nfs.client.rpc.duration
    type: metric
    metric_name: obi.stat.nfs.client.rpc.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Execute time of each NFS client RPC attempt, from the task's start to
      its end, backlog and retransmissions included. A retry the server asks
      for (NFSv3 JUKEBOX, NFSv4 DELAY or GRACE) is a new attempt, counted as
      an error followed by a slower attempt that includes the client's
      backoff (5 s after a JUKEBOX); it is not a retransmission.
    attributes:
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level:
          conditionally_required: for NFSv2 and NFSv3 RPCs
      - ref: nfs.operation.name
        requirement_level:
          conditionally_required: for NFSv4 RPCs
      - ref: server.address
        requirement_level:
          recommended: the server's IP address, as the mount option addr= shows it
      - ref: k8s.node.name
        requirement_level:
          recommended: when Kubernetes metadata is enabled
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.nfs.client.rpc.errors
    type: metric
    metric_name: obi.stat.nfs.client.rpc.errors
    instrument: counter
    unit: "{error}"
    stability: development
    brief: >
      Count of NFS client RPC attempts that ended with an error status, as
      mountstats counts errors: normal misses (ENOENT on LOOKUP or OPEN,
      which every O_CREAT on NFSv3 produces) and server back-pressure
      (EJUKEBOX, NFS4ERR_DELAY) included.
    attributes:
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level:
          conditionally_required: for NFSv2 and NFSv3 RPCs
      - ref: nfs.operation.name
        requirement_level:
          conditionally_required: for NFSv4 RPCs
      - ref: server.address
        requirement_level:
          recommended: the server's IP address, as the mount option addr= shows it
      - ref: k8s.node.name
        requirement_level:
          recommended: when Kubernetes metadata is enabled
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: error.type
        requirement_level: required

  - id: metric.obi.obi.stat.nfs.client.rpc.retransmits
    type: metric
    metric_name: obi.stat.nfs.client.rpc.retransmits
    instrument: counter
    unit: "{retransmit}"
    stability: development
    brief: >
      Count of retransmissions of NFS client RPC requests: every transmission
      of an attempt after its first. The OBI counterpart of the hostmetrics
      receiver's nfs.client.rpc.retransmit.count.
    attributes:
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level:
          conditionally_required: for NFSv2 and NFSv3 RPCs
      - ref: nfs.operation.name
        requirement_level:
          conditionally_required: for NFSv4 RPCs
      - ref: server.address
        requirement_level:
          recommended: the server's IP address, as the mount option addr= shows it
      - ref: k8s.node.name
        requirement_level:
          recommended: when Kubernetes metadata is enabled
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in

  # Wire bytes of each RPC attempt's call and reply: the sunrpc
  # rpc_stats_latency tracepoint's rq_xmit_bytes_sent and
  # rq_reply_bytes_recvd, the same fields /proc/self/mountstats sums, so this
  # includes RPC/XDR headers and every procedure (larger than the fs NFS
  # bytes of obi.stat.fs.io). The kernel counts an attempt's two directions
  # in the same key, so by default this metric's series are one pair per
  # server, not broken down by procedure or version as the other NFS client
  # RPC metrics are.
  - id: metric.obi.obi.stat.nfs.client.io
    type: metric
    metric_name: obi.stat.nfs.client.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      Count of wire bytes of NFS client RPC calls and replies, by direction:
      transmit is sent to the server, receive is from it.
    attributes:
      - ref: network.io.direction
        requirement_level: recommended
      - ref: onc_rpc.version
        requirement_level: opt_in
      - ref: onc_rpc.procedure.name
        requirement_level: opt_in
      - ref: nfs.operation.name
        requirement_level: opt_in
      - ref: server.address
        requirement_level:
          recommended: the server's IP address, as the mount option addr= shows it
      - ref: k8s.node.name
        requirement_level:
          recommended: when Kubernetes metadata is enabled
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
