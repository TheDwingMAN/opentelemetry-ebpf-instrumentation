  - id: metric.obi.obi.stat.disk.operation.inflight
    type: metric
    metric_name: obi.stat.disk.operation.inflight
    instrument: updowncounter
    unit: "{operation}"
    stability: development
    brief: >
      Block reads and writes that each device is serving when sampled, every
      `ebpf.batch_timeout`: issued to the device and not yet completed, as
      `/sys/block/<device>/inflight` counts them, per block device and
      direction. Discards count as writes. Requests waiting in the I/O
      scheduler are not counted: from Linux 6.10 and on RHEL 9.6,
      /proc/diskstats field 9 (node_exporter's node_disk_io_now, the
      hostmetrics receiver's system.disk.pending_operations) counts them too,
      so it can be higher. For a bio-based volume (LVM, md RAID), it counts the
      bios submitted to the volume and not yet completed.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: system.device
        requirement_level: recommended
      - ref: obi.disk.volume.name
        requirement_level:
          conditionally_required: if the block device is a device mapper device
      - ref: obi.disk.stacked
        requirement_level: recommended
      - ref: disk.io.direction
        requirement_level: recommended
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled

  - id: metric.obi.obi.stat.nfs.client.procedure.duration
    type: metric
    metric_name: obi.stat.nfs.client.procedure.duration
    instrument: histogram
    unit: "s"
    stability: development
    brief: >
      Time that each RPC of the kernel NFS client takes, from the start of its
      RPC task to its completion, per server, procedure, NFS version and
      outcome: the wait for a transport slot, the transmissions, the
      retransmissions and the server's reply. It is the execute time of
      /proc/self/mountstats (nfsiostat's avg exe), which includes the
      round-trip time, not the round-trip time alone. For NFSv4,
      `onc_rpc.procedure.name` is the name that the kernel client gives to
      each kind of COMPOUND request, after its main operation, e.g. `READ` or
      `OPEN`. Its workload attributes are opt-in:
      `obi.stat.nfs.client.procedure.time` and
      `obi.stat.nfs.client.procedure.count` give the mean per workload.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level: recommended
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the RPC failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level: opt_in
      - ref: k8s.owner.name
        requirement_level: opt_in
      - ref: k8s.kind
        requirement_level: opt_in
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.nfs.client.procedure.count
    type: metric
    metric_name: obi.stat.nfs.client.procedure.count
    instrument: counter
    unit: "{procedure}"
    stability: development
    brief: >
      Completed RPCs of the kernel NFS client, those of
      `obi.stat.nfs.client.procedure.duration`, per server, procedure, NFS
      version, outcome and workload whose thread started them. For NFSv3, they
      are the counts of the semantic conventions' `nfs.client.procedure.count`,
      with the server, the outcome and the workload. For NFSv4,
      `onc_rpc.procedure.name` is the name that the kernel client gives to each
      kind of COMPOUND request (e.g. `READ` or `OPEN`), whose counts the
      hostmetrics receiver reports as `nfs.client.operation.count`, with
      `nfs.operation.name`.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level: recommended
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the RPC failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.nfs.client.procedure.time
    type: metric
    metric_name: obi.stat.nfs.client.procedure.time
    instrument: counter
    unit: "s"
    stability: development
    brief: >
      Sum of the durations of the completed RPCs of the kernel NFS client, as
      `obi.stat.nfs.client.procedure.duration` measures them, per server,
      procedure, NFS version, outcome and workload whose thread started them.
      Divided by `obi.stat.nfs.client.procedure.count`, both summed by the same
      attributes, it is the mean RPC time.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: onc_rpc.procedure.name
        requirement_level: recommended
      - ref: onc_rpc.version
        requirement_level: recommended
      - ref: error.type
        requirement_level:
          conditionally_required: if the RPC failed
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.nfs.client.io
    type: metric
    metric_name: obi.stat.nfs.client.io
    instrument: counter
    unit: "By"
    stability: development
    brief: >
      File data that the READ and WRITE RPCs of the kernel NFS client
      transferred, per server, direction (`receive`: read from the server,
      `transmit`: written to it) and workload whose thread started the RPCs:
      the bytes that the server read and wrote, as /proc/self/mountstats counts
      them, without the RPC headers and the other procedures.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: server.address
        requirement_level: recommended
      - ref: network.io.direction
        requirement_level: recommended
      - ref: container.id
        requirement_level: opt_in
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled
      - ref: k8s.namespace.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.owner.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.kind
        requirement_level:
          recommended: if Kubernetes decoration is enabled and the thread that started the RPC runs in a pod
      - ref: k8s.pod.name
        requirement_level: opt_in
      - ref: k8s.container.name
        requirement_level: opt_in

  - id: metric.obi.obi.stat.disk.volume.info
    type: metric
    metric_name: obi.stat.disk.volume.info
    instrument: updowncounter
    unit: ""
    stability: development
    brief: >
      Info metric that links each stacked volume of the node (device mapper,
      md RAID or loop device) to the disks it is on: one series per volume and
      disk, of value 1, reported once more with 0 when the volume is gone.
      Join it on `system.device` with the block I/O metrics. A volume over
      several disks (md RAID1) has a series per disk, a volume over another
      stacked volume has the disks of the bottom one, and a loop device has the
      disks of the filesystem that holds its file. A dm-multipath device has
      its paths, and a volume over it has the multipath device, which reports
      the I/O of the paths.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: obi.disk.volume.device
        requirement_level: recommended
      - ref: obi.disk.volume.name
        requirement_level:
          conditionally_required: if the volume is a device mapper volume
      - ref: system.device
        requirement_level: recommended
      - ref: k8s.cluster.name
        requirement_level:
          recommended: if Kubernetes decoration is enabled

  - id: metric.obi.obi.stat.k8s.pod.volume.info
    type: metric
    metric_name: obi.stat.k8s.pod.volume.info
    instrument: updowncounter
    unit: ""
    stability: development
    brief: >
      Info metric that links each volume that a pod of the node mounts from a
      PersistentVolumeClaim to the device it is mounted from
      (`obi.disk.volume.device`) and to the disks of that device
      (`system.device`): one series per pod, volume and disk, of value 1,
      reported once more with 0 when the pod no longer mounts it. Join it on
      `system.device` with the block I/O metrics. A volume on a stacked
      device, such as an LVM volume over several disks, has one series per
      disk. A volume on a dm-multipath device has the multipath device, which
      reports the I/O of its paths.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: k8s.volume.name
        requirement_level: recommended
      - ref: k8s.volume.type
        requirement_level: opt_in
      - ref: k8s.persistentvolumeclaim.name
        requirement_level: recommended
      - ref: k8s.persistentvolume.name
        requirement_level: recommended
      - ref: obi.disk.volume.device
        requirement_level: recommended
      - ref: system.device
        requirement_level: recommended
      - ref: k8s.cluster.name
        requirement_level: recommended
      - ref: k8s.namespace.name
        requirement_level: recommended
      - ref: k8s.pod.name
        requirement_level: recommended
      - ref: k8s.owner.name
        requirement_level: recommended
      - ref: k8s.kind
        requirement_level: recommended
