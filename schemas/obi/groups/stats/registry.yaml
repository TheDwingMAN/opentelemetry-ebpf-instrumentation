file_format: definition/2
attributes:
  - key: reason
    type:
      members:
        - id: refused
          value: refused
          stability: development
        - id: reset
          value: reset
          stability: development
        - id: timed_out
          value: timed-out
          stability: development
        - id: host_unreachable
          value: host-unreachable
          stability: development
        - id: net_unreachable
          value: net-unreachable
          stability: development
        - id: other
          value: other
          stability: development
        - id: unknown
          value: unknown
          stability: development
    stability: development
    brief: Classification of why a TCP connection failed.
  # Mirrors `NetworkTCPHandshakeRoleType` in
  # `pkg/internal/statsolly/ebpf/stat.go`. Identifies which side of the
  # TCP handshake OBI observed the connection on.
  - key: network.tcp.handshake.role
    type:
      members:
        - id: client
          value: client
          stability: development
        - id: server
          value: server
          stability: development
        - id: unknown
          value: unknown
          stability: development
    stability: development
    brief: >
      Role of the local endpoint in the TCP three-way handshake
      (`client` initiated the SYN, `server` was awaiting it).
  - key: obi.disk.stacked
    type: boolean
    stability: development
    brief: >
      Whether the block device (`system.device`) is built on other block
      devices that also report its I/O, as device mapper, md RAID and loop
      devices are. A dm-multipath device is not, as its paths report
      nothing. To count the I/O once, add up the devices where it is
      `false`.
    examples: [true]
  - key: obi.disk.volume.name
    type: string
    stability: development
    brief: >
      Device mapper name of the block device (`system.device`), as
      `/dev/mapper` lists it. Absent for the other devices.
    examples: ["mpatha"]

attribute_groups:
  # `obi.ip` / `src.*` / `dst.*` are reused from `registry.obi.network` so we
  # don't duplicate the declarations here. Only the stats-specific `reason`
  # is introduced.
  - id: registry.obi.stats
    visibility: public
    brief: >
      Attributes carried on OBI's per-connection TCP statistics. Emitted
      when the `stats_tcp_rtt`, `stats_tcp_failed_connections` or
      `stats_tcp_successful_connections` features are enabled (all rolled
      into the umbrella `stats` feature). Like
      network-flow metrics, the per-data-point attribute set is configurable
      via `attributes.select`.
    stability: development
    attributes:
      - ref: reason
      - ref: network.tcp.handshake.role

  - id: registry.obi.disk
    visibility: public
    brief: >
      Attributes of OBI's block I/O (disk) statistics that the semantic
      conventions don't define.
    stability: development
    attributes:
      - ref: obi.disk.stacked
      - ref: obi.disk.volume.name
