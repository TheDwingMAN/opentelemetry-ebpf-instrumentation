groups:
  # `obi.ip` / `src.*` / `dst.*` are reused from `registry.obi.network` so we
  # don't duplicate the declarations here. Only the stats-specific `reason`
  # is introduced.
  - id: registry.obi.stats
    type: attribute_group
    display_name: OBI Connection Stats
    brief: >
      Attributes carried on OBI's per-connection TCP statistics. Emitted
      when the `stats_tcp_rtt`, `stats_tcp_failed_connections` or
      `stats_tcp_successful_connections` features are enabled (all rolled
      into the umbrella `stats` feature). Like
      network-flow metrics, the per-data-point attribute set is configurable
      via `attributes.select`.
    attributes:
      - id: reason
        type:
          allow_custom_values: true
          members:
            - id: refused
              value: refused
              stability: development
            - id: reset
              value: reset
              stability: development
            - id: timed_out
              value: timed-out
              stability: development
            - id: host_unreachable
              value: host-unreachable
              stability: development
            - id: net_unreachable
              value: net-unreachable
              stability: development
            - id: other
              value: other
              stability: development
            - id: unknown
              value: unknown
              stability: development
        stability: development
        brief: Classification of why a TCP connection failed.
      # Mirrors `NetworkTCPHandshakeRoleType` in
      # `pkg/internal/statsolly/ebpf/stat.go`. Identifies which side of the
      # TCP handshake OBI observed the connection on.
      - id: network.tcp.handshake.role
        type:
          allow_custom_values: true
          members:
            - id: client
              value: client
              stability: development
            - id: server
              value: server
              stability: development
            - id: unknown
              value: unknown
              stability: development
        stability: development
        brief: >
          Role of the local endpoint in the TCP three-way handshake
          (`client` initiated the SYN, `server` was awaiting it).

  - id: registry.obi.disk
    type: attribute_group
    display_name: OBI Disk Stats
    brief: >
      Attributes of OBI's block I/O (disk) statistics that the semantic
      conventions don't define.
    attributes:
      - id: obi.disk.stacked
        type: boolean
        stability: development
        brief: >
          Whether the block device (`system.device`) is built on other block
          devices: device mapper (LVM, dm-crypt, multipath), md RAID and loop
          devices pass their I/O down to the devices below them, which report it
          too. To count the I/O once on the disk counters, add up the devices
          where it is `false`; on `obi.stat.disk.service.duration` and
          `obi.stat.disk.flush.duration`, add those and the dm-multipath
          devices, whose paths don't report them.
      - id: obi.disk.volume.name
        type: string
        stability: development
        brief: >
          Name of the device mapper device, as `/dev/mapper` and `dmsetup ls`
          list it, of `system.device` on the block I/O metrics. Omitted for the
          other devices, such as disks, md RAID and loop devices. OBI refreshes
          it every 30 seconds, so a new volume that the kernel gives the numbers
          of a removed one can carry the name of the removed one for up to 30
          seconds.
        examples: ["mpatha"]
