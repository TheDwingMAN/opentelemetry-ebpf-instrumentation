groups:
  # `obi.ip` / `src.*` / `dst.*` are reused from `registry.obi.network` so we
  # don't duplicate the declarations here. Only the stats-specific `reason`
  # and `fs.operation` are introduced.
  - id: registry.obi.stats
    type: attribute_group
    display_name: OBI Connection Stats
    brief: >
      Attributes carried on OBI's per-connection TCP statistics and
      filesystem I/O stats. Emitted when the `stats_tcp_rtt`,
      `stats_tcp_failed_connections`, `stats_tcp_successful_connections` or
      `storage_fs*` features are enabled (the TCP ones are rolled into the
      umbrella `stats` feature; `storage_fs*` is opt-in and not part of it).
      Like network-flow metrics, the per-data-point attribute set is
      configurable via `attributes.select`.
    attributes:
      - id: reason
        type:
          allow_custom_values: true
          members:
            - id: refused
              value: refused
              stability: development
            - id: reset
              value: reset
              stability: development
            - id: timed_out
              value: timed-out
              stability: development
            - id: host_unreachable
              value: host-unreachable
              stability: development
            - id: net_unreachable
              value: net-unreachable
              stability: development
            - id: other
              value: other
              stability: development
            - id: unknown
              value: unknown
              stability: development
        stability: development
        brief: Classification of why a TCP connection failed.
      # Mirrors `NetworkTCPHandshakeRoleType` in
      # `pkg/internal/statsolly/ebpf/stat.go`. Identifies which side of the
      # TCP handshake OBI observed the connection on.
      - id: network.tcp.handshake.role
        type:
          allow_custom_values: true
          members:
            - id: client
              value: client
              stability: development
            - id: server
              value: server
              stability: development
            - id: unknown
              value: unknown
              stability: development
        stability: development
        brief: >
          Role of the local endpoint in the TCP three-way handshake
          (`client` initiated the SYN, `server` was awaiting it).
      # Mirrors `FsOpType` in `pkg/internal/statsolly/ebpf/stat.go`.
      # The filesystem type is identified by which implementation the probe
      # fired on, not by inspecting the event.
      - id: fs.operation
        type:
          allow_custom_values: false
          members:
            - id: read
              value: read
              stability: development
            - id: write
              value: write
              stability: development
            - id: fsync
              value: fsync
              stability: development
            - id: fdatasync
              value: fdatasync
              stability: development
        stability: development
        brief: Filesystem operation performed.
      # Mirrors the devInfo cache in pkg/internal/statsolly/ebpf/block_stack.go.
      # A device is stacked when it does not issue requests to hardware
      # itself (device-mapper, software RAID, loop, or an NVMe native
      # multipath head); a partition inherits its whole disk's value.
      - id: obi.disk.stacked
        type: boolean
        stability: development
        brief: >
          Whether the disk is a stacked device (device-mapper, software
          RAID, loop, or an NVMe multipath head) rather than one that issues
          requests directly to hardware.
        examples: [true, false]
      # The fs join label of step 10 (FEATURES-V3-SPEC.md section 1.2):
      # userspace sysfs walk from a filesystem's block device to the disks
      # that do not themselves issue requests to hardware
      # (obi.disk.stacked=false), through device-mapper, software RAID,
      # NVMe multipath and loop backing files. Lets a filesystem series be
      # joined to the disk series of the physical hardware underneath it,
      # without a topology metric.
      - id: obi.disk.physical_device
        type: string
        stability: development
        brief: >
          Physical disk(s) behind a filesystem's block device: sorted,
          comma-joined, at most 8. Omitted when the filesystem is not
          block-backed, or the walk cannot resolve one.
        examples: ["vdb", "nvme0n1,nvme1n1"]
