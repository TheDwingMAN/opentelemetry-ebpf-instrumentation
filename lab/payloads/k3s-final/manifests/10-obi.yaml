# OBI with the storage metrics on OpenShift: oc apply -f obi-openshift.yaml
#
# Before applying, replace:
#   <REGISTRY>               the registry you pushed the image to (obi:disk-v2-23410d280)
#   10.0.2.15              the OTLP/HTTP address of your OpenTelemetry Collector, e.g.
#                            otel-collector.observability.svc.cluster.local
#   lab-k3s                reported as k8s.cluster.name
#
# OBI needs no disk, and one host directory: tracefs, writable, for the file sync probes. It reads
# the host's files through /proc/1/root and /proc (it shares the host's PID namespace) and the
# block devices through /sys.
apiVersion: v1
kind: Namespace
metadata:
  name: obi
  labels:
    # OBI's pods are privileged: let pod security admission accept them
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    security.openshift.io/scc.podSecurityLabelSync: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: obi
  namespace: obi
---
# The Kubernetes metadata of the workloads (pods, their owners, services and nodes), and the
# PersistentVolumes for the devices of the pod volumes (stats_disk_pod_volumes)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "nodes", "persistentvolumes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obi
subjects:
  - kind: ServiceAccount
    name: obi
    namespace: obi
---
# OpenShift admits a privileged pod that runs as root in the host's PID and network namespaces
# only for service accounts allowed to use the privileged SCC (what
# `oc adm policy add-scc-to-user privileged -z obi -n obi` grants). Without it, the DaemonSet
# creates no pod at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi-scc-privileged
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: obi-scc-privileged
  namespace: obi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obi-scc-privileged
subjects:
  - kind: ServiceAccount
    name: obi
    namespace: obi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obi-config
  namespace: obi
data:
  obi-config.yaml: |
    # OBI configuration, format v1. OBI ignores keys it doesn't know without an error: a
    # misspelled key is silently dropped.
    log_format: json
    # prints the configuration OBI actually uses at startup: check metrics.features in it
    log_config: yaml

    attributes:
      kubernetes:
        enable: true
        cluster_name: lab-k3s
      select:
        # include replaces the default attributes of a metric: list them all. k8s.pod.name and
        # obi.disk.partition only on these counters, not on the latency histograms, to keep the
        # number of series down.
        #
        # The four block counters, obi.stat.disk.io, .operations, .service_time and .queue_time,
        # have the same labels, but error.type, which io doesn't have: it counts the successful
        # requests only. The iostat await of each pod, summed by the same labels on both sides:
        #   sum by (k8s_namespace_name, k8s_pod_name, disk_io_direction) (
        #       rate(obi_stat_disk_service_time_seconds_total{obi_disk_stacked="false"}[5m])
        #     + rate(obi_stat_disk_queue_time_seconds_total{obi_disk_stacked="false"}[5m]))
        #   / sum by (k8s_namespace_name, k8s_pod_name, disk_io_direction) (
        #       rate(obi_stat_disk_operations_total{obi_disk_stacked="false"}[5m]))
        obi.stat.disk.io:
          include: [system.device, obi.disk.volume.name, obi.disk.stacked, obi.disk.partition,
                    disk.io.direction, k8s.namespace.name, k8s.owner.name, k8s.kind, k8s.pod.name,
                    k8s.cluster.name]
        obi.stat.disk.operations:
          include: [system.device, obi.disk.volume.name, obi.disk.stacked, obi.disk.partition,
                    disk.io.direction, error.type, k8s.namespace.name, k8s.owner.name, k8s.kind,
                    k8s.pod.name, k8s.cluster.name]
        obi.stat.disk.service_time:
          include: [system.device, obi.disk.volume.name, obi.disk.stacked, obi.disk.partition,
                    disk.io.direction, error.type, k8s.namespace.name, k8s.owner.name, k8s.kind,
                    k8s.pod.name, k8s.cluster.name]
        obi.stat.disk.queue_time:
          include: [system.device, obi.disk.volume.name, obi.disk.stacked, obi.disk.partition,
                    disk.io.direction, error.type, k8s.namespace.name, k8s.owner.name, k8s.kind,
                    k8s.pod.name, k8s.cluster.name]
        # a histogram: no mountpoint or workload here, which would multiply its buckets per
        # volume and per pod (OBI warns at startup if they are selected). The file sync counters
        # (obi.stat.fs.sync.operations and .operation_time) carry the namespace, owner and kind by
        # default; select the mountpoint on both of them to find a slow volume.
        obi.stat.fs.sync.duration:
          include:
            - obi.fs.sync.type
            - error.type
            # the kernel's name of the filesystem: xfs, overlay, ext4, nfs4, ...
            - system.filesystem.type
            - k8s.cluster.name
        # lab only, as OBI-on-OpenShift.md tells users to find a slow volume: the mountpoint and
        # filesystem type on both file sync counters, with their defaults (run.sh checks the types
        # on obi_stat_fs_sync_operations_total)
        obi.stat.fs.sync.operations:
          include: [obi.fs.sync.type, error.type, system.filesystem.mountpoint, system.filesystem.type,
                    k8s.namespace.name, k8s.owner.name, k8s.kind, k8s.cluster.name]
        obi.stat.fs.sync.operation_time:
          include: [obi.fs.sync.type, error.type, system.filesystem.mountpoint, system.filesystem.type,
                    k8s.namespace.name, k8s.owner.name, k8s.kind, k8s.cluster.name]

    discovery:
      exclude_instrument:
        - exe_path: '{*ebpf_instrument,*otelcol,*obi}'
        - k8s_namespace: obi
        - k8s_namespace: observability
        - k8s_namespace: ook
        - k8s_namespace: '*clickhouse'
      instrument:
        - k8s_namespace: '*'
        - exe_path: /bin/kubelet

    ebpf:
      buffer_sizes:
        http: 8192
        kafka: 8192
        mssql: 8192
        mysql: 8192
        postgres: 8192
        tcp: 8192
      context_propagation: all

    filter:
      network:
        k8s_dst_owner_name:
          not_match: '{kube*,*jaeger-agent*,*prometheus*,*promtail*,*grafana-agent*}'
        k8s_src_owner_name:
          not_match: '{kube*,*jaeger-agent*,*prometheus*,*promtail*,*grafana-agent*}'

    metrics:
      # replaces OBI's default list: everything to export goes here, and only here (a
      # `features` list under prometheus_export or otel_metrics_export would replace it)
      features:
        - application
        - network
        - stats_disk
        - stats_fs_sync
        - stats_nfs
        # pod -> PersistentVolumeClaim -> PersistentVolume -> disk (needs persistentvolumes in the ClusterRole)
        - stats_disk_pod_volumes

    stats:
      # the node IP from the local interfaces, instead of the route to 8.8.8.8
      agent_ip_iface: local

    network:
      enable: true

    otel_metrics_export:
      endpoint: http://10.0.2.15:4318
      protocol: http/protobuf
      instrumentations:
        - '*'

    otel_traces_export:
      endpoint: http://10.0.2.15:4318
      protocol: http/protobuf
      instrumentations:
        - '*'

    # also served on the node, to check what OBI measures: curl <node IP>:9400/metrics
    prometheus_export:
      port: 9400
      path: /metrics
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: obi
  namespace: obi
  labels:
    app.kubernetes.io/name: obi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obi
    spec:
      serviceAccountName: obi
      # the host's processes, cgroups and mounts (through /proc/1/root): needed by every metric
      hostPID: true
      # the node's network: needed by the network metrics, and reports the node's IP
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists # every node, control plane included
      containers:
        - name: obi
          image: obi:disk-v2-23410d280
          imagePullPolicy: IfNotPresent
          args: ["-config", "/config/obi-config.yaml"]
          env:
            # host.id: the node's name instead of its machine ID, to tell the nodes apart in the dashboards
            - name: OTEL_EBPF_HOST_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            # loads eBPF programs and attaches them to the kernel
            privileged: true
            runAsUser: 0
          ports:
            - name: metrics
              containerPort: 9400
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            # tracefs, writable: the file sync return probes are created there, to track up to 256
            # concurrent calls of each sync function (or twice the CPUs, if more) instead of the
            # kernel's default (about twice the CPUs), which loses the syncs of a storage stall
            - name: tracefs
              mountPath: /sys/kernel/tracing
      volumes:
        - name: config
          configMap:
            name: obi-config
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
