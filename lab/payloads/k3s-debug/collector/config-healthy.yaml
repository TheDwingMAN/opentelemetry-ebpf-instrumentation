# Default collector telemetry (no service.telemetry section): its own metrics on localhost:8888
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        verbosity: basic
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [debug]
