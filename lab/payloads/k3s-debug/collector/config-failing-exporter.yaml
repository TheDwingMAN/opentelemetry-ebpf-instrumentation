# A second exporter that can't send, without a sending queue: the collector refuses the data
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        verbosity: basic
      otlphttp/backend:
        endpoint: http://backend.invalid:4318
        retry_on_failure:
          enabled: false
        sending_queue:
          enabled: false
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [debug, otlphttp/backend]
