# Two PVCs and two I/O workloads, one per storage class:
#   - obi-nfs      -> NFS-backed PV   (exercises the nfs.ko client path)
#   - standard     -> kind local-path (exercises the block layer path)
#
# Both are dynamically provisioned so PV names look like real clusters
# (pvc-<uuid>), which is what the mount-path resolver must parse.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-data
  namespace: storage-test
spec:
  storageClassName: obi-nfs
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-data
  namespace: storage-test
spec:
  storageClassName: standard
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfs-io
  namespace: storage-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-io
  template:
    metadata:
      labels:
        app: nfs-io
        workload: storage-io
    spec:
      containers:
        - name: io
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "nfs-io starting against /data"
              i=0
              while true; do
                dd if=/dev/urandom of=/data/w-$((i % 4)).bin bs=64k count=16 2>/dev/null
                sync
                cat /data/w-$((i % 4)).bin > /dev/null
                i=$((i+1))
                sleep 1
              done
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nfs-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-io
  namespace: storage-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-io
  template:
    metadata:
      labels:
        app: local-io
        workload: storage-io
    spec:
      containers:
        - name: io
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "local-io starting against /data"
              i=0
              while true; do
                dd if=/dev/urandom of=/data/w-$((i % 4)).bin bs=64k count=16 2>/dev/null
                sync
                cat /data/w-$((i % 4)).bin > /dev/null
                i=$((i+1))
                sleep 1
              done
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: local-data
