apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: obi
nodes:
  - role: control-plane
    labels:
      cluster.x-k8s.io/cluster-name: obi-k8s-test-cluster
    extraMounts:
      # configuration files that need to be mounted in the host
      - hostPath: ../../configs
        containerPath: /configs
      # testoutput folder to store coverage data
      - hostPath: ../../../../../testoutput
        containerPath: /testoutput
      # OBI semconv registry, mounted read-only into the weaver pod
      - hostPath: ../../../../../schemas/obi
        containerPath: /obi-registry
      # kernel modules, so the in-cluster NFS server can load nfsd and the
      # NFS client modules are resolvable from inside the node container
      - hostPath: /lib/modules
        containerPath: /lib/modules
        readOnly: true
      # tracefs, for kprobe/tracepoint attachment from the OBI DaemonSet
      - hostPath: /sys/kernel/tracing
        containerPath: /sys/kernel/tracing
    extraPortMappings:
      # to avoid having to do port-forwarding from the Go client (a bit cumbersome process),
      # we just make visible some container ports through host ports
      # hostPorts need to be in range 30000-32767
      # containerPort must be the "hostPort" value that needs to be
      # exposed on each Pod container
      - containerPort: 8999
        hostPort: 38999
      - containerPort: 9090
        hostPort: 39090
