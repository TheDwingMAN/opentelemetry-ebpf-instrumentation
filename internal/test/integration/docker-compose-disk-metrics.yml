services:
  # diskload continuously generates real block-layer I/O so the node-wide
  # block_rq_issue/complete tracepoints have data to observe.
  #   - writes: forced to the physical device with `conv=fdatasync` (reliable on
  #     any filesystem) -> block_rq write events.
  #   - reads: best-effort. We drop the page cache and read with O_DIRECT so the
  #     read misses cache and hits the device -> block_rq read events. Both are
  #     best-effort because O_DIRECT / drop_caches behaviour varies by host fs.
  diskload:
    image: alpine:3.20
    privileged: true
    volumes:
      - diskload-data:/data
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          dd if=/dev/zero of=/data/obi-diskload bs=1M count=64 conv=fdatasync 2>/dev/null || true
          sync
          echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
          dd if=/data/obi-diskload of=/dev/null bs=1M iflag=direct 2>/dev/null || \
            dd if=/data/obi-diskload of=/dev/null bs=1M 2>/dev/null || true
          rm -f /data/obi-diskload
          sleep 1
        done

  obi:
    build:
      context: ../../..
      dockerfile: ./internal/test/integration/components/obi/Dockerfile
    volumes:
      - ./configs/:/configs
      - ./system/sys/kernel/security:/sys/kernel/security
      - ../../../testoutput:/coverage
      - ../../../testoutput/run-disk-metrics:/var/run/obi
      - /sys/kernel/tracing:/sys/kernel/tracing:rw
    image: hatest-obi
    privileged: true # storage_block requires privileged AND tracefs mounted (below)
    pid: "host"
    environment:
      OTEL_EBPF_CONFIG_PATH: /configs/obi-config${OTEL_EBPF_CONFIG_SUFFIX}.yml
      GOCOVERDIR: "/coverage"
      OTEL_EBPF_TRACE_PRINTER: "json"
      OTEL_EBPF_DISCOVERY_POLL_INTERVAL: 500ms
      OTEL_EBPF_SERVICE_NAMESPACE: "integration-test"
      OTEL_EBPF_METRICS_INTERVAL: "1s"
      OTEL_EBPF_BPF_BATCH_TIMEOUT: "10ms"
      OTEL_EBPF_OTLP_TRACES_BATCH_TIMEOUT: "1ms"
      OTEL_EBPF_LOG_LEVEL: "DEBUG"
      OTEL_EBPF_BPF_DEBUG: "TRUE"
      OTEL_EBPF_HOSTNAME: "obi"
      OTEL_EBPF_BPF_HTTP_REQUEST_TIMEOUT: "5s"
      OTEL_EBPF_PROCESSES_INTERVAL: "100ms"
      OTEL_EBPF_METRICS_FEATURES: "storage_block"
      OTEL_EBPF_PROTOCOL_DEBUG_PRINT: "true"
      OTEL_EBPF_PROMETHEUS_PORT: "8999"
    depends_on:
      diskload:
        condition: service_started
    ports:
        - "8999:8999" # Prometheus scrape port, if enabled via config


  # OpenTelemetry Collector
  otelcol:
    image: otel/opentelemetry-collector-contrib:0.156.0@sha256:125bdbeb7590cc1952c5b3430ecf14063568980c2c93d5b38676cc0446ed8108
    container_name: otel-col
    deploy:
      resources:
        limits:
          memory: 125M
    restart: unless-stopped
    # No weaver tap in this suite. The disk metrics are asserted directly over
    # both export paths (OTLP via this collector, and OBI's own Prometheus
    # endpoint), so the schema live-check is not on the critical path here.
    # Dropping weaver also removes its 90s healthcheck start_period, which the
    # collector used to wait on before it could accept OTLP at all.
    command: ["--config=/etc/otelcol-config/otelcol-config.yml"]
    volumes:
      - ./configs/:/etc/otelcol-config
    ports:
      - "4317" # OTLP over gRPC receiver
      - "4318:4318" # OTLP over HTTP receiver
      - "9464" # Prometheus exporter
      - "8888" # metrics endpoint
    depends_on:
      prometheus:
        condition: service_started

 # Prometheus
  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus-config${PROM_CONFIG_SUFFIX}.yml
      - --web.enable-lifecycle
      - --web.route-prefix=/
    volumes:
      - ./configs/:/etc/prometheus
    ports:
      - "9090:9090"

volumes:
  diskload-data:
